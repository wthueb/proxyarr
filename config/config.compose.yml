server:
  host: 0.0.0.0
  port: 8484

logging:
  level: debug

# Two qBittorrent-pointing prefixes form a dedup group against the one
# qBittorrent, so adding the same torrent through both /radarr-qbit and
# /sonarr-qbit lands a single torrent tagged with both instance names.
clients:
  - name: qbittorrent
    type: qbittorrent
    upstream: http://qbittorrent:8080

  - name: radarr-qbit
    type: qbittorrent
    upstream: http://qbittorrent:8080
    dedupe:
      enabled: true
      category: proxyarr

  - name: sonarr-qbit
    type: qbittorrent
    upstream: http://qbittorrent:8080
    dedupe:
      enabled: true
      category: proxyarr

  - name: sabnzbd
    type: sabnzbd
    upstream: http://sabnzbd:8080
