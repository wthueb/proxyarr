server:
  host: 0.0.0.0
  port: 8484

logging:
  level: debug

# Two qBittorrent-pointing prefixes form a dedup group against the one
# qBittorrent, so adding the same torrent through /qbittorrent/radarr and
# /qbittorrent/sonarr lands a single torrent tagged with both instance names.
clients:
  qbittorrent:
    upstreams:
      - name: main
        url: http://qbittorrent:8080
    groups:
      - name: shared
        category: proxyarr
    instances:
      - name: direct
        upstream: main
      - name: radarr
        upstream: main
        group: shared
      - name: sonarr
        upstream: main
        group: shared

  sabnzbd:
    upstreams:
      - name: main
        url: http://sabnzbd:8080
    instances:
      - name: direct
        upstream: main
