# proxyarr configuration.
#
# Pass the path with --config <path>, the PROXYARR_CONFIG environment
# variable, or place a config.yml in the working directory.

server:
  host: 0.0.0.0
  port: 8484

# SQLite database backing SABnzbd dedup (see below). Optional; defaults to
# proxyarr.db next to this config file. Only touched when a sabnzbd instance
# references a group.
# database: /config/proxyarr.db

logging:
  # trace | debug | information | warning | error | critical | none
  level: information
  # logfmt (default) | json
  format: logfmt
  # Per-category minimum levels. Framework categories (Microsoft, System) default
  # to warning and Yarp is disabled entirely because it logs full upstream URLs
  # including query-string credentials; re-raise them here if you need to.
  overrides: {}
  #  Microsoft.AspNetCore: information

clients:
  qbittorrent:
    upstreams:
      - name: main
        url: http://localhost:8080
        # Optional: make this upstream's returned paths unique before *arr applies
        # its host-scoped Remote Path Mappings.
        # path_mappings:
        #   - from: /downloads
        #     to: /proxyarr/qbit-main

    # Instances in the same named group share downloads. The group's category
    # is the real category used in qBittorrent.
    groups:
      - name: radarr
        category: radarr
      - name: sonarr
        category: sonarr

    instances:
      - name: radarr # URL Base: /qbittorrent/radarr
        upstream: main
        group: radarr
      - name: radarr4k # URL Base: /qbittorrent/radarr4k
        upstream: main
        group: radarr
      - name: sonarr # URL Base: /qbittorrent/sonarr
        upstream: main
        group: sonarr
      - name: sonarr4k # URL Base: /qbittorrent/sonarr4k
        upstream: main
        group: sonarr

  sabnzbd:
    upstreams:
      - name: main
        url: http://localhost:8085/sabnzbd
        # path_mappings:
        #   - from: /downloads
        #     to: /proxyarr/sab-main

    groups:
      - name: radarr
        category: radarr
        # Extra category names to report as existing to Radarr.
        announce_categories: [movies, movies-4k]
      - name: sonarr
        category: sonarr
        announce_categories: [tv, tv-4k]

    instances:
      - name: radarr # URL Base: /sabnzbd/radarr
        upstream: main
        group: radarr
      - name: radarr4k # URL Base: /sabnzbd/radarr4k
        upstream: main
        group: radarr
      - name: sonarr # URL Base: /sabnzbd/sonarr
        upstream: main
        group: sonarr
      - name: sonarr4k # URL Base: /sabnzbd/sonarr4k
        upstream: main
        group: sonarr

# Omit an instance's `group` to disable deduplication. It is a byte-identical
# pass-through unless its upstream explicitly configures `path_mappings`.
