# proxyarr configuration.
#
# Pass the path with --config <path>, the PROXYARR_CONFIG environment
# variable, or place a config.yml in the working directory.

server:
  host: 0.0.0.0
  port: 8484

# SQLite database backing SABnzbd dedup (see below). Optional; defaults to
# proxyarr.db next to this config file. Only touched when a sabnzbd client
# has dedupe enabled.
# database: /config/proxyarr.db

logging:
  # trace | debug | information | warning | error | critical | none
  level: information
  # logfmt (default) | json
  format: logfmt
  # Emit logger scopes (e.g. ASP.NET Core request ids) as extra fields.
  include_scopes: false
  # Per-category minimum levels. Framework categories (Microsoft, System) default
  # to warning and Yarp is disabled entirely because it logs full upstream URLs
  # including query-string credentials; re-raise them here if you need to.
  overrides: {}
  #  Microsoft.AspNetCore: information

clients:
  - name: qbittorrent1
    type: qbittorrent
    upstream: http://localhost:8080

  - name: qbittorrent2
    type: qbittorrent
    upstream: http://localhost:8081

  - name: sabnzbd
    type: sabnzbd
    upstream: http://localhost:8085/sabnzbd

# ---------------------------------------------------------------------------
# Cross-instance download deduplication (opt-in per instance)
#
# Point several Radarr/Sonarr instances at ONE qBittorrent (or ONE SABnzbd)
# through separate proxyarr prefixes. When more than one grabs the same
# release, proxyarr adds it upstream only once and shares it, instead of the
# instances fighting over qBittorrent's single-category-per-torrent model or
# double-downloading the NZB.
#
# Instances of the same type sharing an upstream URL are grouped
# automatically; ownership is tracked by the proxyarr instance name — as a
# qBittorrent tag per torrent, or a SABnzbd claim row in the database.
# ---------------------------------------------------------------------------
#
#   - name: radarr-qbit          # one prefix per *arr, all pointing at the
#     type: qbittorrent          # same qBittorrent
#     upstream: http://localhost:8080
#     dedupe:
#       enabled: true            # required to turn any dedupe option on
#       category: proxyarr       # real category assigned upstream; omit to add
#                                # content with NO category at all
#       # group: main            # optional; only needed to force-group two
#                                # instances reachable via different hostnames
#
#   - name: sonarr-qbit
#     type: qbittorrent
#     upstream: http://localhost:8080
#     dedupe:
#       enabled: true
#       category: proxyarr       # all members of a group must agree on this
#
#   - name: radarr-sab
#     type: sabnzbd
#     upstream: http://localhost:8085/sabnzbd
#     dedupe:
#       enabled: true
#       category: proxyarr
#       announce_categories:     # sabnzbd only: extra category names to report
#         - movies               # as existing so the *arr's category check passes
#         - tv
